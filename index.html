<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="may22">
<title>分組求生記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
/* Layout: pixel classroom stage at an integer scale, HUD above, touch joystick in its own strip below (never over the game), chunky pixel-box sheets for dialogs and mini-games. Single deliberate pastel look. */
:root{
  --ink:#2b2440; --muted:#655e80; --bg:#d9e1ff; --panel:#fbfaff; --floor:#efe7ff;
  --peach:#ffb38a; --lilac:#b9a6f2; --mint:#7fd3ae; --bad:#ff6f6f; --good:#2fae7d; --gold:#ffcf4d;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --px:"Press Start 2P","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--zh);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(rgba(43,36,64,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,36,64,.05) 1px,transparent 1px);
  background-size:16px 16px}
button{touch-action:manipulation}
.wrap{max-width:1040px;margin:0 auto;padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:clamp(24px,5vw,36px);font-weight:900;letter-spacing:.04em;line-height:1.1;text-shadow:3px 3px 0 var(--peach)}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.hbtns{display:flex;gap:8px;flex:none}
#soundBtn[aria-pressed="false"]{background:var(--floor);color:var(--muted)}
@media (max-width:520px){.top .sub{display:none}}
.box{background:var(--panel);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.game{position:relative;display:flex;flex-direction:column;gap:10px;-webkit-user-select:none;user-select:none}
.hud{display:flex;flex-direction:column;gap:6px;padding:8px 10px}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.timer{font-family:var(--px);font-size:12px;padding:7px 8px;background:var(--gold);border:2px solid var(--ink);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
.timer.low{background:var(--bad);color:#fff}
.slots{display:flex;gap:4px;align-items:center}
.slot{width:28px;height:38px;border:2px dashed var(--muted);display:grid;place-items:center;background:var(--floor)}
.slot.on{border-style:solid;border-color:var(--ink);background:#fff}
.slot img{width:15px;height:24px;image-rendering:pixelated}
.lbl{font-weight:700;font-size:13px;color:var(--muted)}
.spacer{flex:1}
.topic{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border:2px solid var(--ink);background:#fff;line-height:1.5;white-space:nowrap}
.sk.ok{background:var(--mint)}
.sk.need{border-style:dashed;color:var(--muted)}
.btn{font-family:var(--zh);font-weight:900;font-size:15px;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 14px;min-height:46px;cursor:pointer;line-height:1.3;text-align:left}
.btn:hover{background:var(--floor)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.pick:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.btn.pri{background:var(--peach)} .btn.go{background:var(--mint)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.big{font-size:20px;min-height:58px;text-align:center;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.stage{position:relative;padding:0;line-height:0;background:#e8c796;display:flex;justify-content:center;overflow:hidden}
#cv{display:block;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
.hint{font-size:13px;color:var(--muted);margin:0}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 12px;font-size:13px;line-height:1.4;font-weight:700;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:3}
/* joystick strip: sits below the stage, never on top of it */
.ctrl{display:none;align-items:center;gap:16px;padding:10px 12px}
@media (pointer:coarse),(max-width:760px){.ctrl{display:flex} .hint{display:none}}
.joy{width:128px;height:128px;flex:none;position:relative;border:3px solid var(--ink);background:var(--floor);touch-action:none;cursor:pointer;
  background-image:linear-gradient(var(--lilac),var(--lilac)),linear-gradient(var(--lilac),var(--lilac));background-size:100% 4px,4px 100%;background-position:center;background-repeat:no-repeat}
.joy i{position:absolute;font-style:normal;font-size:11px;line-height:1;color:var(--muted);pointer-events:none}
.joy .au{top:6px;left:50%;transform:translateX(-50%)} .joy .ad{bottom:6px;left:50%;transform:translateX(-50%)}
.joy .al{left:6px;top:50%;transform:translateY(-50%)} .joy .ar{right:6px;top:50%;transform:translateY(-50%)}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;background:var(--peach);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);pointer-events:none}
.joy.on .knob{background:var(--gold)}
.ctrl-tip{margin:0;font-size:13px;color:var(--muted);min-width:0;line-height:1.5}
.ctrl-tip b{color:var(--ink)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(43,36,64,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
@media (min-width:700px){.modal{align-items:center}}
.sheet{width:100%;max-width:580px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.who{display:flex;gap:14px;align-items:center}
.who > div{min-width:0}
.pf{width:60px;height:96px;flex:none;background:var(--floor);border:3px solid var(--ink);display:grid;place-items:center;position:relative}
.pf img{width:40px;height:64px;image-rendering:pixelated}
.who h2{margin:0;font-size:20px;font-weight:900;line-height:1.3}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.say{margin:0;font-size:16px;font-weight:500}
.clue{margin:0;padding:10px 12px;background:var(--floor);border-left:4px solid var(--lilac);font-size:14px}
.acts{display:flex;flex-direction:column;gap:8px}
.acts.row{flex-direction:row;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:900;padding:2px 8px;border:2px solid var(--ink);margin-right:6px;vertical-align:2px}
.tag.bad{background:var(--bad);color:#fff} .tag.good{background:var(--good);color:#fff} .tag.mg{background:var(--gold)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.brief{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;background:#fff;border:2px solid var(--ink);font-size:14px;align-items:center}
.brief dt{font-weight:900;color:var(--muted);font-size:13px}
.brief dd{margin:0;display:flex;gap:6px;flex-wrap:wrap}
/* project */
.proj{padding:16px;display:flex;flex-direction:column;gap:14px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.bars{grid-template-columns:1fr}}
.bar .bl{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.bar .bl b{font-family:var(--px);font-size:11px;font-variant-numeric:tabular-nums}
.meter{height:16px;border:3px solid var(--ink);background:#fff;margin-top:4px}
.meter i{display:block;height:100%;width:0;transition:width .5s steps(10)}
#mP i{background:var(--mint)} #mM i{background:var(--peach)}
.roundtag{font-family:var(--px);font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.6}
.card{display:flex;flex-direction:column;gap:12px;padding:14px;border:3px solid var(--ink);background:#fff}
.card h3{margin:0;font-size:19px;font-weight:900;line-height:1.35}
.card p{margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.res{padding:10px 12px;background:var(--floor);font-weight:700}
.delta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:900;padding:2px 8px;border:2px solid var(--ink);background:#fff}
.chip.up{background:var(--mint)} .chip.down{background:var(--bad);color:#fff}
.lesson{padding:10px 12px;border:2px dashed var(--ink);font-size:14px}
.lesson b{display:block;margin-bottom:2px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.class{background:#eafaf2;border:3px solid var(--good);padding:12px}
.class .eyebrow{color:var(--good)}
.note{font-size:13px;color:var(--muted)}
/* people picker */
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;align-items:center;gap:6px;font-family:var(--zh);font-weight:700;font-size:13px;color:var(--ink);padding:4px 10px 4px 4px;border:2px solid var(--ink);background:#fff;cursor:pointer;min-height:44px;text-align:left}
.pick img{width:15px;height:24px;image-rendering:pixelated;flex:none}
.pick span{display:flex;flex-direction:column;line-height:1.25}
.pick small{font-size:11px;color:var(--muted);font-weight:700}
.pick small.ok{color:var(--good)}
.pick.sel{background:var(--gold)}
.pick:active{transform:translate(1px,1px)}
.task{display:flex;flex-direction:column;gap:6px;padding:10px;border:2px solid var(--ink);background:var(--panel)}
/* schedule */
.cal{overflow-x:auto;max-width:100%}
.cal table{border-collapse:collapse;font-size:12px;line-height:1.2}
.cal th,.cal td{border:1px solid var(--ink);padding:0;text-align:center}
.cal td{width:19px;height:26px}
.cal td.busy{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,var(--lilac) 2px 5px)}
.cal td.free{background:#fff}
.cal td.free.hit{background:var(--mint)} .cal td.busy.hit{background:var(--bad)}
.cal th.day{font-weight:900;padding:2px 0;background:var(--floor)}
.cal th.slotc{height:30px}
.cal th.slotc button{width:100%;height:100%;min-width:19px;border:0;background:var(--gold);font-family:var(--zh);font-weight:900;font-size:11px;color:var(--ink);cursor:pointer;padding:0}
.cal th.nm{padding:0 6px 0 2px;text-align:left;white-space:nowrap;font-weight:700;background:var(--floor)}
.cal th.nm img{width:10px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:3px}
.tbar{height:12px;border:2px solid var(--ink);background:#fff}
.tbar i{display:block;height:100%;width:100%;background:var(--bad)}
/* rush */
.rushhud{display:flex;justify-content:space-between;font-weight:900;font-variant-numeric:tabular-nums}
.rush{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px;margin:0 auto}
.hole{aspect-ratio:1.35;max-width:100%;border:3px solid var(--ink);background:var(--floor);display:grid;overflow:hidden}
.hole button{border:0;font-family:var(--zh);font-weight:900;font-size:15px;line-height:1.25;cursor:pointer;color:var(--ink);padding:4px;touch-action:manipulation}
.hole button.t{background:var(--mint)} .hole button.x{background:var(--bad);color:#fff}
.hole.flash{background:var(--bad)} .hole.yay{background:var(--gold)}
/* presentation */
.qte{position:relative;height:48px;border:3px solid var(--ink);background:#fff;cursor:pointer;touch-action:manipulation}
.qte .zone{position:absolute;top:0;bottom:0;background:var(--mint)}
.qte .zone b{position:absolute;top:0;bottom:0;left:30%;width:40%;background:var(--good)}
.qte .cur{position:absolute;top:-7px;bottom:-7px;width:6px;margin-left:-3px;background:var(--ink)}
.qfb{min-height:1.6em;font-weight:900}
.grade{font-family:var(--px);font-size:56px;line-height:1;text-shadow:4px 4px 0 var(--peach)}
.final{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.final > div{min-width:0;flex:1}
.score{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;padding:10px 12px;background:var(--floor)}
.score b{font-family:var(--px);font-size:11px;font-variant-numeric:tabular-nums;text-align:right;align-self:center}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center}
.li img{width:20px;height:32px;image-rendering:pixelated;flex:none}
.li > div{min-width:0}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.dx{border:2px solid var(--ink);padding:8px 10px;background:#fff;font-size:13px}
.dx.lock{background:var(--floor);color:var(--muted);border-style:dashed}
.dx strong{font-size:15px}
.dx p{margin:4px 0 0}
.shareimg{display:block;width:100%;max-width:420px;margin:0 auto;border:3px solid var(--ink);image-rendering:auto}
.credit{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
.credit b{font-family:var(--px);font-size:10px;color:var(--ink);letter-spacing:.05em}
.pf.bonk{animation:bonk .4s steps(4)}
@keyframes bonk{0%{transform:translate(0)}25%{transform:translate(-5px,2px) rotate(-6deg)}50%{transform:translate(5px,-2px) rotate(5deg)}75%{transform:translate(-3px,0)}100%{transform:translate(0)}}
.pop{position:absolute;top:-14px;right:-18px;font-weight:900;font-size:16px;line-height:1.4;background:var(--gold);border:2px solid var(--ink);padding:0 6px;animation:pop .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.4)}30%{transform:scale(1.2)}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.pf.bonk,.pop{animation:none}.meter i{transition:none}}
</style>
<style>body{margin:0}img{max-width:100%}</style>

<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>分組求生記</h1>
      <p class="sub">期末專題要分組了。走遍教室，找到神隊友、避開雷隊友。</p>
    </div>
    <div class="hbtns"><button class="btn sm" id="soundBtn" type="button" aria-pressed="true">音效 開</button><button class="btn sm" id="dexBtn" type="button">組員圖鑑</button></div>
  </header>

  <div class="game">
    <div class="hud box" id="hud">
      <div class="hrow">
        <span class="timer" id="timer">75s</span>
        <div class="slots" id="slots"></div>
        <span class="spacer"></span>
        <button class="btn go sm" id="startProj" type="button" disabled>開始做專題</button>
      </div>
      <div class="topic" id="topicBar"></div>
    </div>
    <div class="stage box" id="stage">
      <canvas id="cv" aria-label="像素教室，可以走動找組員"></canvas>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="ctrl box" id="ctrl">
      <div class="joy" id="joy" aria-label="移動搖桿"><i class="au">▲</i><i class="ad">▼</i><i class="al">◀</i><i class="ar">▶</i><span class="knob" id="knob"></span></div>
      <p class="ctrl-tip"><b>拖動搖桿</b>走路，可以斜著走。<br>也可以<b>直接點畫面</b>，會自動繞過桌子走過去。<br>碰到同學就會開始對話。</p>
    </div>
    <p class="hint" id="hint">方向鍵或 WASD 移動，也可以直接點畫面，角色會自動繞過桌子走過去。碰到同學就會開始對話。</p>
    <div class="proj box" id="proj" hidden>
      <div class="bars">
        <div class="bar"><div class="bl"><span>報告進度</span><b id="vP">0</b></div><div class="meter" id="mP"><i></i></div></div>
        <div class="bar"><div class="bl"><span>組內氣氛</span><b id="vM">50</b></div><div class="meter" id="mM"><i></i></div></div>
      </div>
      <div class="roundtag" id="roundtag">WEEK 1</div>
      <div id="card"></div>
    </div>
  </div>
  <p class="credit">遊戲設計 <b>may22</b>・本遊戲會匿名記錄遊玩次數與成績，不含任何個人資料</p>
</div>

<div class="modal" id="modal" hidden><div class="sheet box" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= DATA ================= */
const HIT='用紙扇敲他的頭', SCOLD='把他唸一頓';
const SKILLS={research:'資料蒐集',writing:'文案寫作',design:'簡報美編',speaking:'上台口條',data:'數據分析',video:'影片剪輯',tech:'程式技術'};
const SKILL_LINE={research:'我很會找資料，圖書館資料庫我熟。',writing:'寫報告我還行，以前是校刊社的。',design:'我做簡報很快，排版有點強迫症。',speaking:'上台講話我不怕，辯論社的。',data:'Excel 跟統計我都 OK。',video:'剪片我很熟，有在經營頻道。',tech:'寫程式、架網站可以交給我。'};
const TOPICS=[
  {n:'校園外送平台企劃',s:['research','data','design','speaking']},
  {n:'在地小吃紀錄片',s:['video','research','writing','speaking']},
  {n:'宿舍省電 App 提案',s:['tech','data','design','speaking']},
  {n:'社群行銷活動企劃',s:['writing','design','video','data']},
  {n:'老街文化導覽手冊',s:['research','writing','design','speaking']},
  {n:'二手書交換網站',s:['tech','design','writing','data']},
  {n:'學生睡眠習慣調查',s:['data','research','writing','speaking']}
];
const SURPRISE={
  research:'教授追問：「你們這些資料的來源可靠嗎？」',
  writing:'書面報告被助教退回，說段落邏輯不通順。',
  design:'看了別組的簡報，你們的投影片顯得好陽春。',
  speaking:'上台彩排時，教授連問了三個刁鑽問題。',
  data:'教授突然要求每組附上問卷統計圖表。',
  video:'規定臨時改了：期末要交一支 3 分鐘影片！',
  tech:'要展示的網站在上台前一小時當掉了。'
};
const BAD = {
  lazy:{name:'隱形人',tag:'分了工卻什麼都不做',first:'我都可以啊～你們決定就好。',clue:'問他上學期報告做了哪段，他想了很久說「好像有做吧？」',
    hit:['他揉著頭說「好啦會做」，交了半頁。',3,-6],scold:['他點頭如搗蒜，然後繼續消失。',1,-8],
    ev:[{t:'第一次分工，他說「我都可以」。兩週過去，他那份什麼都沒交。',o:[['指定一個小而明確的任務，附上截止日',11,2,'任務夠具體，他反而準時交了！'],['默默幫他做掉',6,-6,'進度有了，你累到懷疑人生，他學會繼續躺。']]},
        {t:'期末前一週，他負責的段落還是一片空白。',o:[['在貢獻表如實記錄，提醒最後要交給教授',10,0,'他嚇到連夜補完，品質普普但有交。'],['直接去跟教授告狀',5,-3,'教授調了他的分數，但你們的工作量沒變少。']]}],
    lesson:'雷點常常是「責任模糊」。給他小而具體的任務、寫清楚誰在何時交什麼，再用貢獻表留下紀錄。'},

function blocked(x,y){

/* ---------- walk grid + pathfinding (taps route around desks) ---------- */
const CELL=4,GC=W/CELL,GR=H/CELL;
const walk=new Uint8Array(GC*GR);
for(let r=0;r<GR;r++)for(let c=0;c<GC;c++)walk[r*GC+c]=blocked(c*CELL+2,r*CELL+2)?0:1;
const cellOf=(x,y)=>[clamp(Math.floor(x/CELL),0,GC-1),clamp(Math.floor(y/CELL),0,GR-1)];
function lineClear(ax,ay,bx,by){const n=Math.ceil(Math.hypot(bx-ax,by-ay)/1.5);for(let i=1;i<=n;i++){if(blocked(ax+(bx-ax)*i/n,ay+(by-ay)*i/n))return false}return true}
function findPath(sx,sy,tx,ty){
  if(!blocked(tx,ty)&&lineClear(sx,sy,tx,ty))return[{x:tx,y:ty}];
  const N=GC*GR;const [sc,sr]=cellOf(sx,sy);let [tc,tr]=cellOf(tx,ty);
  if(!walk[tr*GC+tc]){let best=-1,bd=1e9;for(let i=0;i<N;i++)if(walk[i]){const d=(i%GC-tc)**2+(((i/GC)|0)-tr)**2;if(d<bd){bd=d;best=i}}if(best<0)return[];tc=best%GC;tr=(best/GC)|0}
  const start=sr*GC+sc,goal=tr*GC+tc;const prev=new Int32Array(N).fill(-1);const q=new Int32Array(N);let h=0,t=0;q[t++]=start;prev[start]=start;
  while(h<t){const cur=q[h++];if(cur===goal)break;const c=cur%GC,r=(cur/GC)|0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nc=c+dc,nr=r+dr;if(nc<0||nr<0||nc>=GC||nr>=GR)continue;const ni=nr*GC+nc;

  while(i<pts.length){let j=pts.length-1;while(j>i&&!lineClear(ax,ay,pts[j].x,pts[j].y))j--;out.push(pts[j]);ax=pts[j].x;ay=pts[j].y;i=j+1}

}
function setDir(e,dx,dy){if(Math.abs(dx)>Math.abs(dy))e.dir=dx<0?'left':'right';else if(dy)e.dir=dy<0?'up':'down'}
/* one small step with corner sliding, so you glide around desk corners instead of sticking */
function slide(e,dx,dy){
  let moved=false;
  if(dx){
    if(!blocked(e.x+dx,e.y)){e.x+=dx;moved=true}
    else if(Math.abs(dy)<.01){for(let k=1;k<=5&&!moved;k++)for(const s of[-1,1]){if(!blocked(e.x+dx,e.y+s*k)){const st=s*Math.min(Math.abs(dx),k);if(!blocked(e.x,e.y+st)){e.y+=st;moved=true;break}}}}
  }
  if(dy){
    if(!blocked(e.x,e.y+dy)){e.y+=dy;moved=true}
    else if(Math.abs(dx)<.01){for(let k=1;k<=6&&!moved;k++)for(const s of[-1,1]){if(!blocked(e.x+s*k,e.y+dy)){const st=s*Math.min(Math.abs(dy),k);if(!blocked(e.x+st,e.y)){e.x+=st;moved=true;break}}}}
  }

}
function stepMove(e,dx,dy){
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/1.2));let moved=false;
  for(let i=0;i<n;i++)if(slide(e,dx/n,dy/n))moved=true;
  setDir(e,dx,dy);return moved;
}
function followPath(e,speed,dt){

  const wp=e.path[0];const vx=wp.x-e.x,vy=wp.y-e.y,d=Math.hypot(vx,vy),step=speed*dt;

}

/* ================= UPDATE ================= */
function update(dt){
  S.time+=dt;
  const live=S.phase==='recruit'&&!modalOpen();
  const p=S.player;
  if(live){
    S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;updTimer();timeUp();return}
    updTimer();
    let ix=0,iy=0;
    if(keys.l)ix--;if(keys.r)ix++;if(keys.u)iy--;if(keys.d)iy++;
    if(joy.on&&(joy.x||joy.y)){ix=joy.x;iy=joy.y}
    const mag=Math.min(1,Math.hypot(ix,iy));
    if(mag>.01){
      p.path=null;p.chase=null;S.mark=null;
      const n=Math.hypot(ix,iy);p.moving=stepMove(p,ix/n*mag*SPEED*dt,iy/n*mag*SPEED*dt);
    }else if(p.path){
      if(p.chase){p.repath-=dt;if(p.repath<=0){p.repath=.3;p.path=findPath(p.x,p.y,p.chase.x,p.chase.y+1)}}
      p.moving=followPath(p,SPEED,dt);
      if(!p.path||!p.path.length){p.path=null;S.mark=null}
    }else p.moving=false;
    if(p.moving){p.step+=dt*8;const l=S.trail[0];if(Math.hypot(p.x-l.x,p.y-l.y)>=1){S.trail.unshift({x:p.x,y:p.y,dir:p.dir});if(S.trail.length>120)S.trail.pop()}}
    if(S.encCd>0)S.encCd-=dt;
    S.approachIn-=dt;
    if(S.approachIn<=0){S.approachIn=rnd(8,13);const c=S.npcs.filter(n=>n.state==='wander'&&n.cd<=0&&!n.approached);if(c.length&&S.team.length<S.need){const n=pick(c);n.state='approach';n.appT=9;n.path=null}}
  }
  const ease=1-Math.exp(-14*dt);
  S.npcs.forEach(n=>{
    if(n.gone)return;
    if(n.state==='follow'){
      const i=S.team.indexOf(n);const tp=S.trail[Math.min(S.trail.length-1,(i+1)*11)];
      const dx=tp.x-n.x,dy=tp.y-n.y;n.moving=Math.hypot(dx,dy)>.5;n.x+=dx*ease;n.y+=dy*ease;if(n.moving){n.step+=dt*8;setDir(n,dx,dy)}
      return;
    }
    if(!live)return;
    if(n.cd>0)n.cd-=dt;
    if(n.state==='approach'){
      n.appT-=dt;if(n.appT<=0){n.state='wander';n.approached=true;n.path=null;return}
      n.repath-=dt;if(n.repath<=0||!n.path||!n.path.length){n.repath=.5;n.path=findPath(n.x,n.y,p.x,p.y)}
      n.moving=followPath(n,42,dt);
    }else{
      if(n.wait>0){n.wait-=dt;n.moving=false}
      else if(n.path&&n.path.length){n.moving=followPath(n,24,dt);if(!n.path||!n.path.length){n.path=null;n.wait=rnd(.8,2.8)}}
      else{const s=freeSpot();n.path=findPath(n.x,n.y,s.x,s.y);if(!n.path.length){n.path=null;n.wait=.6}}
    }
    if(n.moving)n.step+=dt*6;
    if(S.encCd<=0&&n.cd<=0&&Math.hypot(p.x-n.x,p.y-n.y)<12){openEncounter(n,n.state==='approach')}
  });
  if(S.mark)S.mark.t+=dt;
}

/* ================= PROJECT ================= */
const ROUNDS=[{n:'WEEK 06',t:'期中週',d:'題目定好了，開始分工。'},{n:'WEEK 16',t:'期末週',d:'離上台只剩一週。'}];
let mgStop=null;
function stopMG(){if(mgStop){const f=mgStop;mgStop=null;f()}S.qte=null}
function people(){return[{me:true,name:'你',skill:S.mySkill,look:PLAYER_LOOK,bad:false,fixed:0},...S.team.filter(m=>!m.gone)]}
function reliable(m){return m.me||!m.bad||m.fixed>0}
function pickBtn(m,i,target,attrs=''){const ok=target?m.skill===target:S.req.includes(m.skill);return `<button class="pick" type="button" data-p="${i}" ${attrs}><img alt="" src="${portrait(m.look)}"><span>${esc(m.name)}<small class="${ok?'ok':''}">${esc(SKILLS[m.skill])}</small></span></button>`}
function skillMul(m){
  if(!S.req.includes(m.skill))return .6;
  const firstOwner=S.team.find(x=>!x.gone&&x.skill===m.skill);
  return (firstOwner===m&&S.mySkill!==m.skill)?1.25:1;
}
function gain(m,p){return p>0?Math.round(p*S.k*skillMul(m)):Math.round(p*Math.max(1,S.k*.8))}
function startProject(){
  S.phase='project';clearKeys();SFX.bgm(false);SFX.play('start');
  ['stage','hint','hud','ctrl'].forEach(id=>$(id).hidden=true);$('proj').hidden=false;
  S.queue=[];
  const evSkills=shuffle(S.req);
  S.queue.push({kind:'round',ri:0},{kind:'assign'});
  S.team.forEach(m=>S.queue.push({kind:'mem',m,ri:0}));
  S.queue.push({kind:'schedule'},{kind:'event',skill:evSkills[0]},{kind:'round',ri:1});
  S.team.forEach(m=>S.queue.push({kind:'mem',m,ri:1}));
  S.queue.push({kind:'rush'},{kind:'event',skill:evSkills[1%evSkills.length]},{kind:'present'},{kind:'end'});

}
function bars(){
  S.P=clamp(S.P,0,100);S.M=clamp(S.M,0,100);
  $('mP').firstElementChild.style.width=S.P+'%';$('mM').firstElementChild.style.width=S.M+'%';

function apply(p,m){S.P+=p;S.M+=m;bars();return chips(p,m)}
function chips(p,m){const c=(l,v)=>`<span class="chip ${v>0?'up':v<0?'down':''}">${l} ${v>0?'+':''}${v}</span>`;return `<div class="delta">${c('進度',p)}${c('氣氛',m)}</div>`}
function pf(L,name,id){return `<div class="pf" ${id?`id="${id}"`:''}><img alt="${esc(name)}" src="${portrait(L)}"></div>`}
function mulNote(m){const s=skillMul(m);return s>1?`專長「${SKILLS[m.skill]}」正好用得上，成果加成。`:s<1?`專長「${SKILLS[m.skill]}」這次用不太到，成果打折。`:`專長「${SKILLS[m.skill]}」和別人重複了。`}
function nextBtn(label,cls='pri'){return `<div class="acts row"><button class="btn ${cls}" id="nx" type="button">${label}</button></div>`}

function next(){
  stopMG();
  const e=S.queue.shift();const card=$('card');
  if(e.kind==='round'){
    const r=ROUNDS[e.ri];$('roundtag').textContent=r.n+' · '+r.t+' · '+S.topic.n;

      ${nextBtn('繼續')}</div>`;
    card.scrollIntoView({block:'nearest',behavior:'smooth'});
    return bindNext();
  }
  if(e.kind==='assign')return assignCard();
  if(e.kind==='schedule')return scheduleCard();
  if(e.kind==='rush')return rushCard();
  if(e.kind==='present')return presentCard();

function badCard(m,ri){
  const d=BAD[m.key],ev=d.ev[ri];

    mk(ev.o[0][0],ev.o[0][1],ev.o[0][2],ev.o[0][3],ev.o[0][4],{best:true}),mk(ev.o[1][0],ev.o[1][1],ev.o[1][2],ev.o[1][3],ev.o[1][4])]);

    if(m.quit)p.style.opacity=.35;
    bindNext();
  });
}

/* ----- 互動 1：分工配對 ----- */
function assignCard(){
  const ps=people();const sel=S.req.map(()=>null);
  $('card').innerHTML=`<div class="card">${mgHead('分工配對','點選每項工作要交給誰。專長對上的人做得最好，也別把工作全塞給同一個人。綠色字代表專長符合題目。')}
    <h3>把每項工作交給最適合的人</h3>
    ${S.req.map((k,ti)=>`<div class="task"><b>${esc(SKILLS[k])}｜${esc(TASK_DESC[k])}</b><div class="picks">${ps.map((m,i)=>pickBtn(m,i,k,`data-t="${ti}"`)).join('')}</div></div>`).join('')}
    <div id="aRes" class="acts"><button class="btn pri" id="aOk" type="button" disabled>確定分工</button></div></div>`;

  });
  $('aOk').onclick=()=>{
    let match=0;const load=new Map();
    S.req.forEach((k,ti)=>{const m=ps[sel[ti]];if(m.skill===k)match++;load.set(sel[ti],(load.get(sel[ti])||0)+1)});
    const maxLoad=Math.max(...load.values());const heavy=ps[[...load].find(([,c])=>c===maxLoad)[0]];
    const p=match*3+(S.req.length-match);let mm=0,note='';

    else if(load.size>=Math.min(ps.length,S.req.length)){mm=4;note='工作平均分給大家，每個人都有參與感。'}
    else{mm=0;note='有人分到兩項，還算可以。'}

    bindNext();
  };
}

/* ----- 互動 2：喬開會時間 ----- */
function scheduleCard(){
  const ps=people();const NC=15;const gold=Math.floor(Math.random()*NC);
  const busy=ps.map(m=>{const n=m.key==='busy'?11:m.me?4:m.bad?6:4;return new Set(shuffle([...Array(NC).keys()].filter(c=>c!==gold)).slice(0,n))});
  const LIMIT=15;let left=LIMIT,done=false;
  $('card').innerHTML=`<div class="card">${mgHead('喬開會時間','斜線格子代表那個人沒空。在時間到之前，點上方黃色的時段，找一個大家都能來的時間。')}
    <h3>這週要開第一次組會，約哪天？</h3>
    <div class="tbar"><i id="sBar"></i></div>
    <div class="cal"><table><thead><tr><th></th>${DAYS.map(d=>`<th class="day" colspan="3">週${d}</th>`).join('')}</tr>
      <tr><th></th>${[...Array(NC).keys()].map(c=>`<th class="slotc"><button type="button" data-c="${c}" aria-label="週${DAYS[c/3|0]}${SLOTN[c%3]}">${SLOTN[c%3]}</button></th>`).join('')}</tr></thead>
      <tbody>${ps.map((m,i)=>`<tr><th class="nm"><img alt="" src="${portrait(m.look)}">${esc(m.name)}</th>${[...Array(NC).keys()].map(c=>`<td class="${busy[i].has(c)?'busy':'free'}" data-c="${c}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div id="sRes" class="acts"><button class="btn" id="sAsync" type="button">不約了，改成線上非同步討論</button></div></div>`;
  $('card').scrollIntoView({block:'nearest',behavior:'smooth'});
  const finish=(c,why)=>{
    if(done)return;done=true;stopMG();
    let html,p,mm;
    if(c==null){p=4;mm=2;html='大家在共用文件留言討論，雖然慢了點，但每個人都有參與。'}
    else{
      $('card').querySelectorAll(`td[data-c="${c}"]`).forEach(td=>td.classList.add('hit'));
      const miss=ps.filter((m,i)=>busy[i].has(c));
      const when=`週${DAYS[c/3|0]}${SLOTN[c%3]}`;
      if(!miss.length){p=6;mm=5;html=`${why||''}約在${when}，全員到齊！討論超有效率。`}
      else if(miss.length===1){p=3;mm=0;html=`${why||''}約在${when}，${esc(miss[0].name)}沒辦法來，事後還要再跟他說明一次。`}
      else{p=1;mm=-3;html=`${why||''}約在${when}，${miss.map(m=>esc(m.name)).join('、')}都不能來，會議開得零零落落。`}
    }
    SFX.play(p>=4?'good':'bad');
    $('card').querySelectorAll('.cal button,#sAsync').forEach(b=>b.disabled=true);
    $('sRes').outerHTML=`<p class="res">${html}</p>${apply(p,mm)}<div class="lesson"><b>神組員小撇步</b>用表單或共用行事曆讓大家填空檔，比在群組一直問「哪天可以」快很多。真的約不到，就改成非同步討論。</div>${nextBtn('繼續')}`;
    bindNext();
  };
  $('card').querySelector('.cal').addEventListener('click',e=>{const t=e.target.closest('[data-c]');if(t)finish(+t.dataset.c)});
  $('sAsync').onclick=()=>finish(null);
  const t0=performance.now();let raf;
  const tick=now=>{left=LIMIT-(now-t0)/1000;const bar=$('sBar');if(bar)bar.style.width=Math.max(0,left/LIMIT*100)+'%';
    if(left<=0){finish(Math.floor(Math.random()*NC),'時間到！群組裡有人隨便丟了一個時間：');return}raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);mgStop=()=>cancelAnimationFrame(raf);
}

/* ----- 互動 3：期末衝刺 ----- */
function rushCard(){
  const unfixed=S.team.filter(m=>!m.gone&&m.bad&&m.fixed===0);
  const pBad=Math.min(.6,.22+.08*unfixed.length);
  const LIMIT=12;
  $('card').innerHTML=`<div class="card">${mgHead('期末衝刺','12 秒內，盡量點<b>綠色</b>的待辦事項。點到<b>紅色</b>的耍廢誘惑會扣分。'+(unfixed.length?`還沒處理好的雷組員會讓誘惑變多（${unfixed.length} 位）。`:''))}
    <h3>截止前最後一晚，衝！</h3>
    <div class="rushhud"><span>剩下 <span id="rT">${LIMIT.toFixed(1)}</span> 秒</span><span>完成 <span id="rS">0</span></span></div>
    <div class="rush" id="rush">${Array.from({length:9},(_,i)=>`<div class="hole" data-h="${i}"></div>`).join('')}</div>
    <div id="rRes" class="acts"><button class="btn pri big" id="rGo" type="button">開始！</button></div></div>`;
  $('card').scrollIntoView({block:'nearest',behavior:'smooth'});
  const holes=[...$('rush').children];let score=0,running=false,raf,t0,lastSpawn=0;const items=new Map();
  const clearHole=i=>{items.delete(i);holes[i].innerHTML=''};
  $('rush').addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b||!running)return;e.preventDefault();
    const i=+b.parentElement.dataset.h;const it=items.get(i);if(!it)return;
    if(it.t){score++;holes[i].classList.add('yay');SFX.play('tap')}else{score=Math.max(0,score-2);holes[i].classList.add('flash');SFX.play('miss')}
    setTimeout(()=>holes[i].classList.remove('yay','flash'),180);
    clearHole(i);$('rS').textContent=score;
  });
  const end=()=>{
    running=false;cancelAnimationFrame(raf);holes.forEach((h,i)=>clearHole(i));
    const p=clamp(Math.round(score*.7),0,10),mm=score>=12?3:score<6?-3:0;SFX.play(score>=10?'good':'bad');
    $('rRes').outerHTML=`<p class="res">你完成了 ${score} 件待辦事項。${score>=12?'效率爆表！':score>=6?'還算順利。':'被耍廢誘惑打敗了……'}</p>${apply(p,mm)}
      <div class="lesson"><b>神組員小撇步</b>把大工作拆成小待辦，一次專心做一件；手機放遠一點，做完一項就劃掉。</div>${nextBtn('繼續')}`;
    bindNext();
  };
  const tick=now=>{
    const el=(now-t0)/1000,left=LIMIT-el;$('rT').textContent=Math.max(0,left).toFixed(1);
    if(left<=0)return end();
    items.forEach((it,i)=>{if(now>it.until)clearHole(i)});
    if(now-lastSpawn>(el<6?560:440)){
      lastSpawn=now;const free=holes.map((_,i)=>i).filter(i=>!items.has(i));
      if(free.length){const i=pick(free),t=Math.random()>pBad;items.set(i,{t,until:now+(t?1100:1300)});
        holes[i].innerHTML=`<button type="button" class="${t?'t':'x'}">${esc(t?pick(RUSH_T):pick(RUSH_X))}</button>`}
    }
    raf=requestAnimationFrame(tick);
  };
  $('rGo').onclick=()=>{SFX.play('start');$('rGo').disabled=true;$('rGo').textContent='衝刺中！';running=true;t0=performance.now();lastSpawn=0;raf=requestAnimationFrame(tick)};
  mgStop=()=>{running=false;cancelAnimationFrame(raf)};
}

  const PROMPTS=['開場自我介紹','講解核心重點','回答教授提問'];

  const tick=now=>{const dt=last?(now-last)/1000:0;last=now;if(!locked){phase=(phase+dt*speed*2)%2;$('qC').style.left=(1-Math.abs(phase-1))*100+'%'}raf=requestAnimationFrame(tick)};
  const hit=()=>{
    if(locked)return;locked=true;

        bindNext();

    }
  };
  setRound();raf=requestAnimationFrame(tick);
  $('qGo').onclick=hit;$('qBar').addEventListener('pointerdown',e=>{e.preventDefault();hit()});S.qte=hit;

/* traffic source: ?src= / utm_source tag first, then in-app browser, then referrer domain */
const TRAFFIC=(()=>{
  let source='直接開啟',ref='';
  try{
    const q=new URLSearchParams(location.search);
    const tag=(q.get('src')||q.get('utm_source')||'').toLowerCase().replace(/[^a-z0-9_\-]/g,'').slice(0,20);
    const ua=navigator.userAgent||'';
    if(document.referrer){const h=new URL(document.referrer).hostname.replace(/^www\./,'');if(h&&h!==location.hostname)ref=h}
    if(tag)source=tag==='share'?'分享圖卡':tag;
    else if(/\bLine\//i.test(ua))source='LINE';
    else if(/Instagram/i.test(ua))source='Instagram';
    else if(/Barcelona/i.test(ua))source='Threads';
    else if(/FBAN|FBAV|FB_IAB/i.test(ua))source='Facebook';
    else if(ref){
      source=/(^|\.)google\./.test(ref)?'Google 搜尋':/(^|\.)(bing\.com|yahoo\.)/.test(ref)?'其他搜尋':/(^|\.)line\.me$/.test(ref)?'LINE':/instagram\.com$/.test(ref)?'Instagram':/(facebook\.com|fb\.com)$/.test(ref)?'Facebook':/threads\.(net|com)$/.test(ref)?'Threads':/dcard\.tw$/.test(ref)?'Dcard':/(^|\.)github\.com$/.test(ref)?'GitHub':'其他網站';
    }
    if(q.has('src')||[...q.keys()].some(k=>k.startsWith('utm_'))){['src','utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>q.delete(k));const rest=q.toString();history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash)}
  }catch(e){}
  return{source,ref};
})();
const SID=(()=>{try{let v=localStorage.getItem('gs-sid');if(!v){v=Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('gs-sid',v)}return v}catch(e){return 'anon'}})();
function track(event,data){
  if(!STATS_URL||!/github\.io$/.test(location.hostname))return;
  try{
    const body=JSON.stringify(Object.assign({event,sid:SID,device:matchMedia('(pointer:coarse)').matches?'手機平板':'電腦',version:'v7',source:TRAFFIC.source,ref:TRAFFIC.ref},data||{}));
    fetch(STATS_URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(()=>{});
  }catch(e){}
}

  txt(`雷 ${nb} 位・神 ${ng} 位`,970,606,24,700,MUTED,'right');
  const rows=[{me:true,name:'你',look:PLAYER_LOOK,skill:S.mySkill},...S.team];
  const rh=Math.min(96,Math.floor(520/rows.length));
  rows.forEach((m,i)=>{
    const y=632+i*rh;g.globalAlpha=m.quit?.45:1;
    g.fillStyle=FLOOR;g.fillRect(104,y,64,rh-12);g.drawImage(charCanvas(m.look),112,y+(rh-12-72)/2,45,72);
    txt(m.name,190,y+44,32,900,INK);
    const tagCol=m.me?'#ffcf4d':m.bad?'#ff6f6f':'#2fae7d',tagT=m.me?'我':m.bad?'雷':'神';
    g.fillStyle=tagCol;g.fillRect(330,y+10,48,44);g.lineWidth=3;g.strokeStyle=INK;g.strokeRect(330,y+10,48,44);
    txt(tagT,354,y+43,26,900,m.me?INK:'#fff','center');
    const type=m.me?'主角':(m.bad?BAD[m.key]:GOOD[m.key]).name;
    txt(type,398,y+44,30,700,INK);
    const note=m.quit?'退組了':m.bad&&m.fixed===2?'被你感化了':'';
    if(note)txt(note,190,y+76,20,700,MUTED);
    g.font=`700 22px ${zh}`;const sk=SKILLS[m.skill],sw=g.measureText(sk).width+24;
    const ok=S.req.includes(m.skill);g.fillStyle=ok?'#7fd3ae':'#fff';g.fillRect(970-sw,y+14,sw,38);g.lineWidth=3;g.strokeStyle=INK;g.strokeRect(970-sw,y+14,sw,38);
    txt(sk,970-sw/2,y+41,22,700,INK,'center');g.globalAlpha=1;
  });
  // footer
  g.fillStyle=INK;g.fillRect(104,1168,866,4);
  txt(R.grade==='A+'?'我拿到 A+ 了，你也來挑戰！':'你能拿到 A+ 嗎？來挑戰看看！',104,1218,30,900,INK);
  g.font=`16px ${pxf}`;g.fillStyle=MUTED;g.fillText(GAME_URL,104,1252);
  g.font=`700 22px ${zh}`;g.textAlign='right';g.fillText('遊戲設計 may22',970,1252);g.textAlign='left';
  return c;
}

/* ================= SOUND (synthesised chiptune, no files) ================= */
const SFX=(()=>{
  let ac=null,master=null,on=true,bgmT=null,step=0;
  try{on=localStorage.getItem('gs-sound')!=='off'}catch(e){}
  const N={B3:247,C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,C6:1047};
  function ctx(){
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ac=new C();master=ac.createGain();master.gain.value=.55;master.connect(ac.destination)}catch(e){ac=null;return null}}
    if(ac.state==='suspended')ac.resume().catch(()=>{});return ac;
  }
  function tone(f,d,o={}){
    if(!on||!f)return;const a=ctx();if(!a)return;
    const t0=a.currentTime+(o.t||0),osc=a.createOscillator(),g=a.createGain();
    osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t0);
    if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,f+o.slide),t0+d);
    g.gain.setValueAtTime(o.vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+d+.03);
  }
  function noise(d,o={}){
    if(!on)return;const a=ctx();if(!a)return;
    const len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    src.buffer=buf;f.type='highpass';f.frequency.value=o.hp||800;g.gain.value=o.vol||.25;
    src.connect(f);f.connect(g);g.connect(master);src.start(a.currentTime+(o.t||0));
  }
  const seq=(notes,st,o={})=>notes.forEach((n,i)=>tone(n,st*.92,Object.assign({},o,{t:i*st})));
  const lib={
    click:()=>tone(900,.04,{vol:.05}),
    meet:()=>seq([N.E5,N.G5],.07,{vol:.1}),
    approach:()=>seq([N.C5,N.C5,N.G5],.07,{vol:.1,type:'triangle'}),
    talk:()=>seq([N.G4,N.C5,N.E5],.05,{vol:.08}),
    join:()=>seq([N.C5,N.E5,N.G5,N.C6],.08,{vol:.12}),
    bye:()=>seq([N.G4,N.E4],.07,{vol:.07,type:'triangle'}),
    good:()=>seq([N.E5,N.G5,N.C6],.08,{vol:.11,type:'triangle'}),
    bad:()=>seq([N.E4,N.C4],.15,{vol:.12,type:'sawtooth'}),
    hit:()=>{noise(.14,{vol:.4,hp:500});tone(200,.14,{vol:.18,slide:-140})},
    scold:()=>seq([N.A4,N.G4,N.A4,N.G4,N.A4,N.G4],.05,{vol:.07,type:'sawtooth'}),
    quit:()=>tone(520,.7,{type:'triangle',vol:.12,slide:-380}),
    tap:()=>tone(1046,.06,{vol:.1}),
    miss:()=>{tone(150,.16,{vol:.14,type:'sawtooth'});noise(.08,{vol:.12,hp:1500})},
    tick:()=>tone(1300,.035,{vol:.06}),
    perfect:()=>seq([N.G5,N.C6,N.G5,N.C6],.045,{vol:.11}),
    start:()=>seq([N.C5,N.G4,N.C5,N.E5,N.G5],.07,{vol:.11}),
    timeup:()=>seq([N.G4,N.E4,N.C4],.16,{vol:.13,type:'triangle'}),
    aplus:()=>seq([N.C5,N.E5,N.G5,N.C6,0,N.G5,N.C6,N.C6],.11,{vol:.13}),
    pass:()=>seq([N.C5,N.E5,N.G5,N.E5,N.C6],.1,{vol:.11}),
    fail:()=>seq([N.G4,N.F4,N.E4,N.D4,N.C4],.14,{vol:.11,type:'triangle'})
  };
  const MEL=[N.C5,0,N.E5,N.G5,N.A5,N.G5,N.E5,0,N.F5,0,N.A5,N.F5,N.G5,0,N.E5,0,N.D5,0,N.F5,N.E5,N.D5,N.B4,N.C5,0,N.E5,N.D5,N.C5,N.B4,N.C5,0,0,0];
  const BAS=[N.C4,N.C4,N.F4,N.C4,N.G4,N.G4,N.C4,N.G4];
  function bgmStep(){if(!on)return;const m=MEL[step%MEL.length];if(m)tone(m,.14,{type:'triangle',vol:.045});if(step%4===0)tone(BAS[(step/4|0)%BAS.length]/2,.22,{type:'square',vol:.025});step++}
  return{
    play(n){try{lib[n]&&lib[n]()}catch(e){}},
    bgm(go){if(go){if(bgmT)return;step=0;ctx();bgmT=setInterval(bgmStep,165)}else if(bgmT){clearInterval(bgmT);bgmT=null}},
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('gs-sound',on?'on':'off')}catch(e){}if(on)ctx();return on}
  };
})();
function renderSoundBtn(){const b=$('soundBtn');b.textContent=SFX.on?'音效 開':'音效 關';b.setAttribute('aria-pressed',SFX.on)}
$('soundBtn').onclick=()=>{SFX.toggle();renderSoundBtn();if(SFX.on){SFX.play('good');if(S&&(S.phase==='recruit'))SFX.bgm(true)}};
document.addEventListener('click',e=>{if(e.target.closest('.btn,.pick')&&e.target.id!=='soundBtn')SFX.play('click')},true);

/* ================= BOOT ================= */
newGame();setup();renderSoundBtn();track('visit');
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(drawBG);
showIntro();
requestAnimationFrame(t=>{S.last=t;loop(t)});
</script>
